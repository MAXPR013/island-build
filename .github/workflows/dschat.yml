name: build-dschat
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Build DSChat (armv7 / iOS 6.0, ld_classic, SDK-free)
        run: |
          mkdir -p _build
          xcrun -sdk iphoneos clang -x objective-c -std=gnu99 -O2 -fno-objc-arc \
            -target armv7-apple-ios6.0.0 -miphoneos-version-min=6.0 \
            -Idschat -nostdlib -undefined dynamic_lookup -Wl,-ld_classic -lSystem \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -o _build/DSChat dschat/main.m
          file _build/DSChat
      - name: ldid fake-sign
        run: |
          brew install ldid
          ldid -S _build/DSChat
      - name: Build TestMini
        run: |
          xcrun -sdk iphoneos clang -x objective-c -std=gnu99 -O2 -fno-objc-arc \
            -target armv7-apple-ios6.0.0 -miphoneos-version-min=6.0 \
            -Idschat -nostdlib -undefined dynamic_lookup -Wl,-ld_classic -lSystem \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -o _build/TestMini dschat/mini.m
          ldid -S _build/TestMini
          file _build/TestMini
      - name: Pack IPA
        run: |
          mkdir -p Payload/DSChat.app
          cp _build/DSChat Payload/DSChat.app/
          cp dschat/Info.plist "dschat/Icon.png" "dschat/Icon@2x.png" "dschat/Default@2x.png" Payload/DSChat.app/
          zip -r DSChat.ipa Payload
          ls -la DSChat.ipa
      - name: Pack TestMini IPA
        run: |
          mkdir -p PayloadMini/TestMini.app
          cp _build/TestMini PayloadMini/TestMini.app/
          cp dschat/Info-mini.plist PayloadMini/TestMini.app/Info.plist
          cp "dschat/Icon.png" "dschat/Icon@2x.png" PayloadMini/TestMini.app/
          zip -r TestMini.ipa PayloadMini
          ls -la TestMini.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSChat.ipa
          path: DSChat.ipa
      - name: Build Mini variants A/B/C
        run: |
          for V in A B C; do
            xcrun -sdk iphoneos clang -x objective-c -std=gnu99 -O2 -fno-objc-arc \
              -target armv7-apple-ios6.0.0 -miphoneos-version-min=6.0 \
              -Idschat -nostdlib -undefined dynamic_lookup -Wl,-ld_classic -lSystem \
              -framework UIKit -framework Foundation -framework CoreGraphics \
              -o _build/Mini$V dschat/mini$V.m
            ldid -S _build/Mini$V
            mkdir -p P_$V/Payload/Mini$V.app
            cp _build/Mini$V P_$V/Payload/Mini$V.app/
            cp dschat/Icon.png "dschat/Icon@2x.png" P_$V/Payload/Mini$V.app/
            sed -e "s/testmini/mini$V/" -e "s/TestMini/Mini$V/g" dschat/Info-mini.plist > P_$V/Payload/Mini$V.app/Info.plist
            (cd P_$V && zip -r ../Mini$V.ipa Payload)
          done
          ls -la Mini*.ipa
      - name: Upload Mini variants
        uses: actions/upload-artifact@v4
        with:
          name: MiniABC
          path: Mini*.ipa
      - name: Upload TestMini artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestMini.ipa
          path: TestMini.ipa
