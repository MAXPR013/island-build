name: build-dschat
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Build DSChat (armv7 / iOS 6.0, ld_classic, SDK-free)
        run: |
          mkdir -p _build
          xcrun -sdk iphoneos clang -x objective-c -std=gnu99 -O2 -fno-objc-arc \
            -target armv7-apple-ios6.0.0 -miphoneos-version-min=6.0 \
            -Idschat -nostdlib -undefined dynamic_lookup -Wl,-ld_classic \
            -o _build/DSChat dschat/main.m
          file _build/DSChat
      - name: ldid fake-sign
        run: |
          brew install ldid
          ldid -S _build/DSChat
      - name: Pack IPA
        run: |
          mkdir -p Payload/DSChat.app
          cp _build/DSChat Payload/DSChat.app/
          cp dschat/Info.plist "dschat/Icon.png" "dschat/Icon@2x.png" "dschat/Default@2x.png" Payload/DSChat.app/
          zip -r DSChat.ipa Payload
          ls -la DSChat.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSChat.ipa
          path: DSChat.ipa
