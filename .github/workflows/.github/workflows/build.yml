name: build-island
on:
workflow_dispatch:
push:

jobs:
build:
 runs-on: macos-13
 steps:
   - uses: actions/checkout@v4
   - name: 编译 Island.dylib（armv7 / iOS 6.0）
     run: |
       xcrun -sdk iphoneos clang++ -x objective-c++ -std=gnu++98 -fblocks \
         -target armv7-apple-ios6.0.0 -miphoneos-version-min=6.0 \
         -I. -Iiphone -ICydiaSubstrate.framework/Headers \
         -dynamiclib -undefined dynamic_lookup -O2 -fno-objc-arc \
         -o Island.dylib Island.mm -F. -framework CydiaSubstrate
   - name: 上传产物
     uses: actions/upload-artifact@v4
     with:
       name: Island.dylib
       path: Island.dylib
