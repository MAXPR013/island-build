name: build-island
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 选用 Xcode 15.4（最后一个支持 armv7 的大版本）
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: 编译 Island.dylib（armv7 / iOS 6.0，经典链接器）
        run: |
          xcrun -sdk iphoneos clang++ -x objective-c++ -std=gnu++98 -fblocks -target armv7-apple-ios6.0.0 -miphoneos-version-min=6.0 -I. -Iiphone -ICydiaSubstrate.framework/Headers -dynamiclib -undefined dynamic_lookup -O2 -fno-objc-arc -Wl,-ld_classic -o Island.dylib Island.mm -F. -framework CydiaSubstrate
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Island.dylib
          path: Island.dylib
